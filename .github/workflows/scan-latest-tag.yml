name: Scan Latest Release Tag

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Read pinned Trivy version
        id: trivy
        run: echo "version=$(cat .github/trivy-version)" >> "$GITHUB_OUTPUT"

      - name: Check out latest rc tag
        id: tag
        run: |
          tag=$(git tag -l 'rc-v*' --sort=-creatordate | head -1)
          echo "Scanning $tag"
          git checkout "$tag"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Scan lockfiles with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: true
        with:
          version: ${{ steps.trivy.outputs.version }}
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-latest-rc-tag
          ref: ${{ steps.tag.outputs.ref }}
          sha: ${{ steps.tag.outputs.sha }}

  bump-trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Open a PR when a newer Trivy is released
        run: |
          pinned=$(cat .github/trivy-version)
          url=$(curl -fsS -o /dev/null -w '%{redirect_url}' https://github.com/aquasecurity/trivy/releases/latest)
          latest=${url##*/}
          echo "Pinned $pinned, latest $latest"
          [ "$latest" = "$pinned" ] && exit 0

          branch=chore/bump-trivy-version
          title="ci(deps): bump trivy to $latest"
          body="Release notes: https://github.com/aquasecurity/trivy/releases/tag/$latest"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          echo "$latest" > .github/trivy-version
          git commit -am "$title"
          git push --force origin "$branch"

          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          else
            gh pr edit "$branch" --title "$title" --body "$body"
          fi
